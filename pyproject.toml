[project]
name = 'conan_package_tools'
version = "2.0.0"
description = 'Packaging tools for Conan C/C++ package manager'
authors = [
    {name = 'JFrog LTD', email = 'info@conan.io'},
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Build Tools',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
]
requires-python = '>=3.7'
dependencies = [
    'conan>=1.52.0',
    'tabulate>=0.8.0, <0.9.0',
    'pyyaml!=6.0.0,!=5.4.0,!=5.4.1; python_version=="3.12"'
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.urls]
Source = 'https://github.com/AnotherFoxGuy/conan-package-tools'

[project.scripts]
run_create_in_docker="cpt.run_in_docker:run"

[tool.setuptools]
package-dir = {"cpt" = "cpt"}